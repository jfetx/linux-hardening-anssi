# =============================================================================
#  Écarts justifiés et attestations — modèle pour anssi-bp028-r80.sh -j
# -----------------------------------------------------------------------------
#  Copier ce fichier (ex. ecarts-<poste>.conf), adapter chaque ligne AU POSTE RÉEL
#  puis lancer :  sudo bash anssi-bp028-r80.sh -j ecarts-<poste>.conf -o r80-<poste>.csv
#
#  Format : Rxx | motif | justification
#    motif = texte présent dans le point signalé (✘ ou ⚠) par le script,
#            ou « * » pour couvrir toute la recommandation / attester une
#            recommandation MANUEL (vérification organisationnelle faite).
#  Règles :
#    - une justification ne masque QUE les points qui contiennent le motif ;
#    - les textes contenant « <…> », « JJ/MM/AAAA » ou « à compléter » sont
#      refusés tant qu'ils ne sont pas complétés ;
#    - une justification devenue inutile est signalée « sans objet ».
#  Ne garder que les lignes réellement applicables : un écart se justifie par
#  un besoin du projet et une mesure compensatoire, pas par commodité.
# =============================================================================

# --- Écarts techniques (besoin applicatif + mesure compensatoire) ---------------
R12 | net.ipv4.ip_forward | Docker exige le routage IPv4 entre les conteneurs et l'hôte. Compensation : ufw (entrant refusé par défaut), chaîne DOCKER-USER, ports publiés limités à <liste des ports>.
R80 | docker-proxy | Port <port> publié par le conteneur <nom de l'application>, requis par <usage>. Accès limité par ufw/DOCKER-USER à <réseau autorisé>.
R79 | non confiné par AppArmor | Ubuntu ne fournit pas de profil AppArmor pour <sshd / dockerd / sqlservr>. Compensation : accès SSH par clé réservé au groupe ssh-users (I16), conteneurs non privilégiés, intégrité surveillée par AIDE (I26).
R59 | download.docker.com | Dépôt officiel de Docker Inc., signé par une clé dédiée (signed-by), nécessaire à Docker Engine. Dépôt utilisé uniquement pendant la phase de préparation.
R61 | mises à jour automatiques | Poste hors ligne en production : les mises à jour sont appliquées par <le client / l'éditeur> selon la procédure <référence>. Correctifs appliqués à la livraison le JJ/MM/AAAA.
R40 | %sudo | Les administrateurs nominatifs du groupe sudo (<liste>) disposent de tous les droits pour l'exploitation ; toutes les commandes sont tracées (sudo.log, auditd).
R40 | %admin | Règle par défaut d'Ubuntu ; le groupe « admin » n'existe pas sur ce poste (aucun membre).
# R28 | /var : option noexec | Docker installé sans volume /var/lib/docker dédié : noexec sur /var empêcherait l'exécution des conteneurs.
# R8  | mds=full,nosmt | Désactivation de l'hyperthreading refusée : perte de performance mesurée de <x> % sur <application>. Compensation : poste mono-utilisateur, aucun code tiers non maîtrisé.

# --- Attestations (recommandations organisationnelles / matérielles) ------------
R2  | * | BIOS/UEFI vérifié le JJ/MM/AAAA : mot de passe administrateur posé, démarrage sur le disque interne uniquement, <Wi-Fi/Bluetooth/caméra> désactivés.
R30 | * | Comptes revus le JJ/MM/AAAA avec <interlocuteur client> : <compte> (<rôle>), <compte> (<rôle>). Aucun compte inutilisé.
R35 | * | Chaque service dispose de son compte dédié : <service> → <compte>, Docker → root (démon), conteneurs → <utilisateurs des conteneurs>.
R52 | * | Sockets inscriptibles par tous revus le JJ/MM/AAAA : sockets systemd/D-Bus standard (journald, dbus), aucun socket applicatif ouvert à tous.
R58 | * | Paquets revus le JJ/MM/AAAA : installation Ubuntu Server minimale + <paquets ajoutés pour le projet>.
R63 | * | Services actifs revus le JJ/MM/AAAA : <liste des services conservés et leur rôle>.
